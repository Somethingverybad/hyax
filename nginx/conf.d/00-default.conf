# Неизвестный Host → соединение закрываем (444), ничего не показываем.
# /health оставляем: его дёргают без имени домена.
server {
    listen 80 default_server;
    server_name _;
    location = /health { access_log off; return 200 "healthy\n"; add_header Content-Type text/plain; }
    location / { return 444; }
}
