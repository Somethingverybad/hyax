# WebSocket: map для Upgrade через HTTP/2
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP сервер - редирект на HTTPS только если сертификаты есть
server {
    listen 80;
    # TLS снимает внешний прокси; HSTS отдаём отсюда, чтобы браузеры и WebView
    # больше не пробовали http:// даже по старой ссылке.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_name huyax.e-tree.su _;

    # Увеличиваем лимит размера URI (для длинных JWT в query)
    large_client_header_buffers 4 16k;

    # Вложения в чатах: фото с телефона легко весит 5–15 МБ, дефолтный
    # лимит nginx в 1 МБ отбивал их с 413 ещё до Django.
    client_max_body_size 50m;

    # Health check для Docker
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Статические файлы Django
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Страница загрузки Android-приложения: /apk → index.html + сам APK.
    # Файлы лежат в media/apk (страница копируется туда при деплое) — тот же
    # bind-mount, что у медиа, ничего в compose менять не нужно.
    location = /apk { return 302 /apk/; }
    location /apk/ {
        alias /app/media/apk/;
        index index.html;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
            text/html html;
        }
        # CORS: приложение тянет version.json кросс-доменно (origin capacitor://
        # и app://). Файлы публичны, поэтому «*» без креденшелов безопасно.
        add_header Access-Control-Allow-Origin "*" always;
        # Через CDN: страница и манифесты всегда свежие, бинарники кэшируются.
        # Бинарники релиза кэшируем на CDN недолго: имена файлов при релизе те же,
        # а автообновление сверяет sha512 из latest*.yml — час старого файла сломал бы его.
        add_header Cache-Control "public, max-age=600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        if ($uri ~* "\.(json|html|yml)$") { add_header Cache-Control "no-cache" always; add_header Access-Control-Allow-Origin "*" always; }
    }

    # Медиа файлы Django
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=86400";
        # CORS: клиент строит настоящую форму волны голосовых через fetch +
        # decodeAudioData, а это кросс-ориджин (app живёт на capacitor://
        # и app://). Медиа публичны, поэтому «*» без креденшелов безопасно.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # WebSocket endpoints
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Обязательно для WebSocket — отключаем буферизацию
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ответы API идут через CDN — кэшировать их нельзя ни при каких условиях.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CORS отдаёт Django (django-cors-headers): он один источник заголовка
        # и сам обрабатывает preflight. Дублирующий add_header здесь ломал
        # десктоп (origin app://hyax) — ACAO приходил дважды. Веб/мобилка это
        # не задевало: PWA same-origin, натив ходит в обход CORS.
    }

    # PWA приложение
    # Веб-версия — та же сборка, что в приложениях (sux-chat-app/dist),
    # лежит в ./web на хосте. index.html и service worker без кэша, ассеты
    # с хэшем в имени — навсегда.
    location = /sw.js { root /app/web; add_header Cache-Control "no-cache, no-store, must-revalidate" always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; }
    location = /service-worker.js { root /app/web; add_header Cache-Control "no-cache, no-store, must-revalidate" always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; }
    location = /manifest.webmanifest { root /app/web; add_header Cache-Control "no-cache" always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; }
    location /assets/ { root /app/web; add_header Cache-Control "public, max-age=31536000, immutable" always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; }
    location / {
        root /app/web;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

