# wyx.su — сайт мессенджера: главная, правила и политика конфиденциальности.
# Статика из nginx/wyx-site (в репозитории), на сервере лежит в media/wyx —
# тот же bind-mount, что у медиа. TLS снимает Caddy на хосте (блок wyx.su в
# /etc/caddy/Caddyfile → 127.0.0.1:8081), сюда приходит http.
# Деплой: ~/hyax-deploy-wyx.sh (rsync + reload).
server {
    listen 80;
    server_name wyx.su www.wyx.su;
    root /app/media/wyx;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /privacy { try_files /privacy.html =404; add_header Cache-Control "no-cache" always; }
    location = /terms   { try_files /terms.html =404;   add_header Cache-Control "no-cache" always; }
    # Версия для подписи на главной — из манифеста витрины.
    location = /apk/version.json { alias /app/media/apk/version.json; add_header Cache-Control "no-cache" always; }
    location ~* \.(svg|png|css)$ { add_header Cache-Control "public, max-age=86400" always; }
    # Ссылки на профили, ботов и мини-приложения: https://wyx.su/u/<ник>[?app].
    # С установленным WYX их перехватывает приложение (файлы ниже), без него —
    # карточка с «Открыть в WYX» и «Скачать» (страницу рисует Django,
    # chat/webapp.py: wyx_user_page) — с превью для других мессенджеров.
    location ^~ /u/ {
        proxy_pass http://api:8000/api/wyx/u/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $http_accept_language;
    }
    # Аватары для этих карточек и для данных запуска мини-приложений.
    location ^~ /media/avatars/ { alias /app/media/avatars/; add_header Cache-Control "public, max-age=86400" always; }
    # Универсальные ссылки iOS и App Links Android — те же файлы, что у основного домена.
    location = /.well-known/apple-app-site-association { root /app/web; default_type application/json; add_header Cache-Control "no-cache" always; }
    location = /.well-known/assetlinks.json { root /app/web; default_type application/json; add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always; }
}
