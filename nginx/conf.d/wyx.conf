# wyx.su — сайт мессенджера: главная, правила и политика конфиденциальности.
# Статика из nginx/wyx-site (в репозитории), на сервере лежит в media/wyx —
# тот же bind-mount, что у медиа. TLS снимает Caddy на хосте (блок wyx.su в
# /etc/caddy/Caddyfile → 127.0.0.1:8081), сюда приходит http.
# Деплой: ~/hyax-deploy-wyx.sh (rsync + reload).
server {
    listen 80;
    server_name wyx.su www.wyx.su;
    root /app/media/wyx;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /privacy { try_files /privacy.html =404; add_header Cache-Control "no-cache" always; }
    location = /terms   { try_files /terms.html =404;   add_header Cache-Control "no-cache" always; }
    # Версия для подписи на главной — из манифеста витрины.
    location = /apk/version.json { alias /app/media/apk/version.json; add_header Cache-Control "no-cache" always; }
    location ~* \.(svg|png|css)$ { add_header Cache-Control "public, max-age=86400" always; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always; }
}
