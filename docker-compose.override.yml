# Адаптация под общий сервер, где TLS терминирует Caddy.
#
# Базовый docker-compose.yml рассчитан на выделенную машину: свой certbot и
# nginx на 80/443. Здесь 80 и 443 занимает Caddy, обслуживающий и другие
# проекты, поэтому:
#   - nginx проекта публикуется только на localhost, а Caddy проксирует в него
#     huyax.e-tree.su (тот же приём, что у diwatch на порту 8080);
#   - certbot отключён: сертификат выпускает и продлевает Caddy, второй
#     выпускатель на том же домене только мешал бы;
#   - coturn остаётся с прямыми портами — звонки идут мимо Caddy, ему UDP
#     не проксировать.
#
# Файл подхватывается автоматически: docker compose up -d
services:
  nginx:
    ports:
      - "127.0.0.1:8081:80"

  # Отключаем, не удаляя из базового файла: профиль, который никогда не
  # активируется при обычном up.
  certbot:
    profiles: ["disabled"]
