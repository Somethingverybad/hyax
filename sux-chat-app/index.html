<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: клавиатура ужимает саму раскладку
         (innerHeight, dvh), а не визуальный viewport. Без этого Chromium на
         части прошивок (vivo) панорамировал визуальный viewport к полю ввода
         и не откатывал — интерфейс уезжал на высоту клавиатуры. iOS атрибут
         игнорирует. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f0f10" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- iOS Safari specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhoYaX" />
    
    <title>WhoYaX Мессенджер</title>
    <meta name="description" content="Современный мессенджер для общения с друзьями" />

    <meta property="og:title" content="WhoYaX Мессенджер" />
    <meta property="og:description" content="Современный мессенджер для общения с друзьями" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <!-- Заставка при запуске приложения: Lottie-сборка логотипа (public/splash.json,
         генератор — design/splash/make_lottie.py) на белом — системный сплэш тоже
         белый, переход бесшовный. Уходит, когда анимация доиграла и приложение
         отрисовалось (событие hyax:ready из App.tsx); не дольше 10 с на случай
         сбоя. Только в приложениях: в браузере плеер даже не грузится. -->
    <div id="boot-splash" style="position:fixed;inset:0;z-index:2147483647;background:#F4F8F1;display:none;align-items:center;justify-content:center;transition:opacity 280ms ease-out">
      <div id="boot-anim" style="width:min(100vw,520px);height:min(100vw,520px);pointer-events:none"></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("boot-splash");
        var cap = window.Capacitor;
        var isApp = (cap && cap.isNativePlatform && cap.isNativePlatform()) || location.protocol === "capacitor:"
          || /Electron/.test(navigator.userAgent) || (location.hostname === "localhost" && /Android/.test(navigator.userAgent));
        if (!isApp) { el.parentNode.removeChild(el); return; }
        // Цвета — под тему: фон темы, в тёмной буквы светлые (см. themes/builtin).
        var theme = null;
        try { theme = JSON.parse(localStorage.getItem("hyax-theme-def") || "null"); } catch (e) {}
        var dark = theme ? theme.base === "dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var bg = (theme && theme.colors && theme.colors.background) || (dark ? "#222B27" : "#F4F8F1");
        el.style.background = bg;
        document.documentElement.style.background = bg;
        el.style.display = "flex";
        function hex(c) { var n = parseInt(String(c).replace("#", ""), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255, 1]; }
        function recolor(data) {
          if (!dark) return data;
          var ink = hex((theme && theme.colors && theme.colors.foreground) || "#FFFFFF");
          // Точка тёмно-мятная — на тёмном фоне её не видно, берём основной цвет темы.
          var dot = hex((theme && theme.colors && theme.colors.primary) || "#C7F964");
          (data.layers || []).forEach(function (l) {
            var c = /^letter /.test(l.nm || "") ? ink : l.nm === "dot" ? dot : null;
            if (!c) return;
            (l.shapes || []).forEach(function (g) { (g.it || []).forEach(function (it) { if (it.ty === "fl") it.c.k = c; }); });
          });
          return data;
        }
        // Виброотклик по меткам анимации (markers: «haptic:light|medium»).
        var H = cap && cap.Plugins && cap.Plugins.Haptics;
        function buzz(kind) { try { if (H && H.impact) H.impact({ style: kind === "medium" ? "MEDIUM" : "LIGHT" }); } catch (e) {} }
        var ended = false, ready = false, gone = false;
        function done() {
          if (gone || !ended || !ready) return;
          gone = true; el.style.opacity = "0";
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
        }
        function finish() { ended = true; done(); }
        window.addEventListener("hyax:ready", function () { ready = true; done(); });
        setTimeout(finish, 7000);
        setTimeout(function () { ended = true; ready = true; done(); }, 10000);
        var s = document.createElement("script");
        s.src = "./lottie_light.min.js";
        s.onerror = finish;
        s.onload = function () {
          fetch("./splash.json").then(function (r) { return r.json(); }).then(function (data) {
            var marks = (data.markers || []).filter(function (m) { return /^haptic:/.test(m.cm || ""); });
            var a = window.lottie.loadAnimation({ container: document.getElementById("boot-anim"), renderer: "svg", loop: false, autoplay: true, animationData: recolor(data) });
            var last = -1;
            a.addEventListener("enterFrame", function (e) {
              var f = e.currentTime;
              marks.forEach(function (m) { if (m.tm > last && m.tm <= f) buzz(m.cm.slice(7)); });
              last = f;
            });
            a.addEventListener("complete", finish);
            a.addEventListener("data_failed", finish);
          }).catch(finish);
        };
        document.head.appendChild(s);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
