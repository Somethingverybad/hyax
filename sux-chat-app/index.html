<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: клавиатура ужимает саму раскладку
         (innerHeight, dvh), а не визуальный viewport. Без этого Chromium на
         части прошивок (vivo) панорамировал визуальный viewport к полю ввода
         и не откатывал — интерфейс уезжал на высоту клавиатуры. iOS атрибут
         игнорирует. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f0f10" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- iOS Safari specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhoYaX" />
    
    <title>WhoYaX Мессенджер</title>
    <meta name="description" content="Современный мессенджер для общения с друзьями" />

    <meta property="og:title" content="WhoYaX Мессенджер" />
    <meta property="og:description" content="Современный мессенджер для общения с друзьями" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
