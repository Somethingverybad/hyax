apply plugin: 'com.android.application'

// Версия считается по числу коммитов: без её роста установщик считает APK
// «той же самой» сборкой и отказывается ставить поверх — приходилось удалять
// приложение вручную.
def gitVersionCode = { ->
    try {
        def count = "git rev-list --count HEAD".execute(null, rootDir).text.trim()
        return count ? count.toInteger() : 1
    } catch (Exception ignored) {
        return 1
    }
}()

android {
    namespace "com.huyax.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hyax.messenger"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Нативный WebRTC весит по сборке на каждый процессор; из четырёх
        // нужны только те, что стоят в живых телефонах — иначе APK пухнет
        // втрое ради эмуляторных x86.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        versionCode gitVersionCode
        // Маркетинговая версия — из package.json, чтобы совпадала с iOS, десктопом и страницей /apk.
        versionName new groovy.json.JsonSlurper().parse(new File(rootDir, "../package.json")).version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Релизная подпись: ключ лежит вне репозитория (~/hyax-release.keystore),
    // параметры — в android/keystore.properties (в .gitignore). Нет файла —
    // релиз подписывается отладочным ключом, чтобы сборка не падала.
    def ksProps = new Properties()
    def ksFile = rootProject.file("keystore.properties")
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
    signingConfigs {
        release {
            if (ksProps["storeFile"]) {
                storeFile file(ksProps["storeFile"])
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            // R8: Google Play считает долю обфусцированного DEX (была 2 %, ниже
            // порога 25 % — приложение реже показывают в выдаче). Ресурсы не
            // ужимаем (shrinkResources): звуки и иконки ищутся по имени.
            // Правила для плагинов и моста — в proguard-rules.pro. Карта имён
            // для стектрейсов лежит в AAB, Play берёт её сам.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig ksProps["storeFile"] ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Наш FCM-сервис звонков (CallMessagingService) наследует FirebaseMessagingService:
    // плагин тянет firebase-messaging как implementation, приложению он не виден.
    implementation "com.google.firebase:firebase-messaging:24.1.0"
    // Нативный WebRTC: разговор в WebView не переживает блокировку экрана
    implementation "io.github.webrtc-sdk:android:125.6422.07"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
