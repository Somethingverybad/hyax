# Нативный клиент WYX для iPhone. Проект генерируется XcodeGen:
#   cd ios-native && xcodegen generate
# Живёт рядом с Capacitor-приложением (WhoYaX, com.hyax.messenger), у него свой
# bundle id — на телефоне и в TestFlight они не пересекаются.
name: WYX
options:
  bundleIdPrefix: com.hyax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: BTQ69VVHX6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: 4.4.0
targets:
  WYX:
    type: application
    platform: iOS
    sources:
      - path: WYX
    dependencies:
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyax.wyx
        PRODUCT_NAME: WYX
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-lz"
    info:
      path: WYX/Info.plist
      properties:
        CFBundleDisplayName: WYX
        CFBundleName: WYX
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
        NSPhotoLibraryUsageDescription: "Чтобы отправить фото в чат"
        NSCameraUsageDescription: "Чтобы снять фото или видео для чата"
        NSMicrophoneUsageDescription: "Чтобы записать голосовое сообщение"
        NSLocationWhenInUseUsageDescription: "Чтобы отправить геопозицию в чат"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
