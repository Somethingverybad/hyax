# Нативный клиент WYX для iPhone. Проект генерируется XcodeGen:
#   cd ios-native && xcodegen generate
# Живёт рядом с Capacitor-приложением (WhoYaX, com.hyax.messenger), у него свой
# bundle id — на телефоне и в TestFlight они не пересекаются.
#
# Пуши: нужен GoogleService-Info.plist для com.hyax.wyx (Firebase console →
# добавить iOS-приложение) в WYX/Resources/. Без него Firebase не поднимается,
# приложение работает без пушей.
name: WYX
options:
  bundleIdPrefix: com.hyax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: BTQ69VVHX6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: 4.4.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  WYX:
    type: application
    platform: iOS
    sources:
      - path: WYX
    dependencies:
      - package: Lottie
      - package: Firebase
        product: FirebaseMessaging
      - target: WYXNotificationService
        embed: true
    entitlements:
      path: WYX/WYX.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hyax.wyx.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyax.wyx
        PRODUCT_NAME: WYX
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-lz -ObjC"
    info:
      path: WYX/Info.plist
      properties:
        CFBundleDisplayName: WYX
        CFBundleName: WYX
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        UIBackgroundModes:
          - remote-notification
          - audio
        FirebaseAppDelegateProxyEnabled: false
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
        NSPhotoLibraryUsageDescription: "Чтобы отправить фото в чат"
        NSCameraUsageDescription: "Чтобы снять фото или видео для чата"
        NSMicrophoneUsageDescription: "Чтобы записать голосовое сообщение"
        NSLocationWhenInUseUsageDescription: "Чтобы отправить геопозицию в чат"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  WYXNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: WYXNotificationService
    entitlements:
      path: WYXNotificationService/NotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hyax.wyx.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyax.wyx.NotificationService
        PRODUCT_NAME: WYXNotificationService
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: WYXNotificationService/Info.plist
      properties:
        CFBundleDisplayName: WYX Notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
