services:
  nginx:
    image: nginx:latest
    container_name: sux_chat_nginx
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/certs:/etc/letsencrypt:ro
      - ./backend/static:/app/static:ro
      - ./backend/media:/app/media:ro
      - ./web:/app/web:ro

    expose:
      - "80"
    networks:
      - sux_chat_network

  certbot:
    image: certbot/certbot:latest
    container_name: sux_chat_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/certs:/etc/letsencrypt
    entrypoint: ["certbot"]
    command:
      [
        "certonly",
        "--webroot",
        "--webroot-path=/var/www/certbot",
        "--email", "Ancher001@yandex.ru",
        "--agree-tos",
        "--no-eff-email",
        "-d", "huyax.e-tree.su"
      ]
    networks:
      - sux_chat_network

  api:
    build: ./backend
    container_name: sux_chat_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 sux_chat.asgi:application"
    volumes:
      - ./backend:/app
      - ./certbot/certs:/etc/letsencrypt:ro
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - db
      - coturn
    networks:
      - sux_chat_network
      - tg_v6  # выход в IPv6: api.telegram.org по IPv4 у провайдера недоступен

  coturn:
    image: coturn/coturn:4.6.3
    container_name: sux_chat_coturn
    restart: unless-stopped
    command: >
      -n
      --fingerprint
      --realm=${TURN_REALM:-huyax.e-tree.su}
      --lt-cred-mech
      --user=${TURN_USERNAME:-turnuser}:${TURN_PASSWORD:-turnpassword}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --no-cli
      --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - sux_chat_network

  db:
    image: postgres:15
    container_name: sux_chat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sux_chat_network

networks:
  sux_chat_network:
    external: true  # ← ДОБАВЬТЕ ЭТУ СТРОКУ
    name: sux_chat_network  # ← И ЭТУ (опционально, для ясности)

  # IPv6-only выход для api. С хоста Telegram Bot API отвечает только по IPv6
  # (IPv4-диапазоны 149.154.0.0/16 у провайдера не маршрутизируются), а
  # sux_chat_network создана без IPv6. Docker ≥27 сам делает NAT66 (ip6tables)
  # для ULA-подсети, поэтому контейнеру достаточно попасть в эту сеть.
  tg_v6:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd7a:1e9a:c0de::/64

volumes:
  postgres_data:
