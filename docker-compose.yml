services:
  nginx:
    image: nginx:latest
    container_name: sux_chat_nginx
    restart: unless-stopped
    depends_on:
      - api
      - pwa
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/certs:/etc/letsencrypt:ro
      - ./backend/static:/app/static:ro
      - ./backend/media:/app/media:ro
    expose:
      - "80"
    networks:
      - sux_chat_network

  pwa:
    image: nginx:alpine
    container_name: sux_chat_pwa
    restart: unless-stopped
    volumes:
      - ./sux-chat-pwa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./sux-chat-pwa/dist:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      - sux_chat_network

  certbot:
    image: certbot/certbot:latest
    container_name: sux_chat_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/certs:/etc/letsencrypt
    entrypoint: ["certbot"]
    command:
      [
        "certonly",
        "--webroot",
        "--webroot-path=/var/www/certbot",
        "--email", "Ancher001@yandex.ru",
        "--agree-tos",
        "--no-eff-email",
        "-d", "sux.cardiokit.beget.tech"
      ]
    networks:
      - sux_chat_network

  api:
    build: ./backend
    container_name: sux_chat_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 sux_chat.asgi:application"
    volumes:
      - ./backend:/app
      - ./certbot/certs:/etc/letsencrypt:ro
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - db
    networks:
      - sux_chat_network

  db:
    image: postgres:15
    container_name: sux_chat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sux_chat_network

networks:
  sux_chat_network:
    external: true  # ← ДОБАВЬТЕ ЭТУ СТРОКУ
    name: sux_chat_network  # ← И ЭТУ (опционально, для ясности)

volumes:
  postgres_data: