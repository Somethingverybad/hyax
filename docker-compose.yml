services:
  nginx:
    image: nginx:latest
    container_name: sux_chat_nginx
    restart: unless-stopped
    # Журналы — не дольше 30 дней, как обещает политика конфиденциальности
    # (IP, время и адрес запроса). Без лимита docker копил их с момента
    # создания контейнера; при ~28 МБ в сутки 5 × 100 МБ — около 18 дней.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    depends_on:
      - api
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/certs:/etc/letsencrypt:ro
      - ./backend/static:/app/static:ro
      - ./backend/media:/app/media:ro
      - ./web:/app/web:ro

    expose:
      - "80"
    networks:
      - sux_chat_network

  certbot:
    image: certbot/certbot:latest
    container_name: sux_chat_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/certs:/etc/letsencrypt
    entrypoint: ["certbot"]
    command:
      [
        "certonly",
        "--webroot",
        "--webroot-path=/var/www/certbot",
        "--email", "Ancher001@yandex.ru",
        "--agree-tos",
        "--no-eff-email",
        "-d", "huyax.e-tree.su"
      ]
    networks:
      - sux_chat_network

  api:
    build: ./backend
    container_name: sux_chat_api
    restart: unless-stopped
    # Журналы — не дольше 30 дней (см. nginx): ~1,3 МБ в сутки, 3 × 10 МБ.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Несколько процессов: один daphne упирался в одно ядро, и при утреннем
    # наплыве запросы со всех устройств вставали в очередь (p90 списка чатов
    # 0,8 с при 4 свободных ядрах). gunicorn держит API_WORKERS воркеров
    # uvicorn; состояние между ними — в Redis (сервис redis ниже, REDIS_URL).
    # Команда gunicorn — одной строкой: в свёрнутом блоке YAML (>) строки с
    # большим отступом сохраняют переносы, и sh получал опции отдельными
    # командами (gunicorn стартовал без них, на 127.0.0.1 одним sync-воркером).
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn sux_chat.asgi:application -k uvicorn_worker.UvicornWorker -w ${API_WORKERS:-3} -b 0.0.0.0:8000 --timeout 120 --graceful-timeout 30 --access-logfile - --access-logformat '%(h)s \"%(r)s\" %(s)s %(b)s %(M)sms'"
    volumes:
      - ./backend:/app
      - ./certbot/certs:/etc/letsencrypt:ro
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Картинки с серверов YouTube из Москвы не открываются — chat/linkimage.py
      # качает их через тот же прокси, что и медиа-бот (сервис ytproxy).
      LINK_PROXY: http://ytproxy:8888
      # Распознавание голосовых (bots/whisper-server, chat/transcribe.py): сервис
      # whisper ниже — одна копия модели на все воркеры (раньше копия была в
      # каждом, 09.11 ядро убивало их по памяти); запасной — на нидерландском
      # сервере (процессор там без AVX-512 VNNI, в 3–5 раз медленнее). Ключ
      # WHISPER_TOKEN — в .env. Никто не ответил — модель в процессе API, но не
      # больше одной на контейнер.
      # Порядок: Windows-сервер в Москве (bots/whisper-server/windows, тот же
      # процессор — так же быстро, и память этого сервера не тратится), затем
      # сервис whisper рядом, затем Нидерланды. WHISPER_CA — оба своих сертификата.
      WHISPER_URL: https://195.58.153.245:8745/transcribe,http://whisper:8745/transcribe,https://[2a13:d201:1:df::1]:8745/transcribe
      WHISPER_CA: /app/certs/whisper-ca.pem
      # LibreTranslate выключен 09.11 (держал 1,2 ГБ ради запасного перевода):
      # переводит только OpenRouter через ретранслятор. Вернуть — эта строка
      # (LIBRETRANSLATE_URL: http://translate:5000) и docker compose --profile libre up -d translate.
    expose:
      - "8000"
    depends_on:
      - db
      - redis
      - coturn
    networks:
      - sux_chat_network
      - tg_v6  # выход в IPv6: api.telegram.org по IPv4 у провайдера недоступен
    # Резолвер отдаёт IPv4-адреса Telegram первыми, а они у провайдера уходят в
    # чёрную дыру (не reject, а silent drop) — urllib3 доходит до IPv6 только
    # после полного таймаута на каждом v4-адресе. /etc/hosts приоритетнее DNS,
    # поэтому прибиваем имя к AAAA; TLS цел, имя хоста то же. Если Telegram
    # сменит адрес — сверить `dig AAAA api.telegram.org` и поправить здесь.
    extra_hosts:
      - "api.telegram.org:2001:67c:4e8:f004::9"

  # Зеркала Telegram-каналов: реальный аккаунт через Telethon (MTProto) вступает
  # в каналы, которые люди подключили ссылкой, и пересылает посты в WYX в
  # реальном времени. Тот же образ, что у api, и та же база через Django ORM.
  # Перед первым запуском — вход: docker compose run --rm -it tg python manage.py tg_login
  # (TG_API_ID/TG_API_HASH в .env, сессия ляжет в backend/private/tg.session).
  tg:
    build: ./backend
    container_name: sux_chat_tg
    restart: unless-stopped
    # Журналы — с лимитом, как у api.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: python manage.py tg_mirror
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      # Тот же Redis, что у api: события зеркала доходят до сокетов, а «кто
      # смотрит чат» (пуш не нужен) читается общее, не своя пустая память.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - api
    networks:
      - sux_chat_network
      - tg_v6  # MTProto по IPv6 — IPv4 Telegram у провайдера глушится (см. api)

  # Бот: ссылка в чат — файл в ответ. Ходит во внутренний api по токену бота,
  # поэтому трафик не выходит наружу и шлюз не режет большие файлы.
  media-bot:
    build: ./bots/media-bot
    container_name: sux_chat_media_bot
    restart: unless-stopped
    environment:
      HYAX_API: http://api:8000/api
      HYAX_WS: ws://api:8000/ws
      HYAX_BOT_TOKEN: ${MEDIA_BOT_TOKEN:-}
      HYAX_QUALITY: ${MEDIA_BOT_QUALITY:-720}
      HYAX_PARALLEL: ${MEDIA_BOT_PARALLEL:-2}
      COOKIES_DIR: /cookies
      # Из Москвы YouTube закрыт — yt-dlp ходит через прокси в Нидерландах
      # (сервис ytproxy ниже). Внутренний api — напрямую.
      HTTPS_PROXY: http://ytproxy:8888
      HTTP_PROXY: http://ytproxy:8888
      NO_PROXY: api,localhost,127.0.0.1
    volumes:
      # Не только на чтение: yt-dlp продлевает сессию и переписывает файл —
      # иначе куки протухают за считаные дни.
      - ./bots/media-bot/cookies:/cookies
    depends_on:
      - api
      - ytproxy
    networks:
      - sux_chat_network

  # TLS-обёртка до прокси на нидерландском сервере (bots/ytproxy/nginx.conf).
  ytproxy:
    image: nginx:stable-alpine
    container_name: sux_chat_ytproxy
    restart: unless-stopped
    volumes:
      - ./bots/ytproxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./bots/ytproxy/certs:/certs:ro
    networks:
      - sux_chat_network
      - tg_v6  # до нидерландского сервера — по IPv6: его IPv4 из России заблокирован (11.11)

  # «Осколки Короны» — пошаговая стратегия, мини-приложение бота
  # (bots/shards/README.md). Страница и WebSocket — https://hyax.ru/shards/ (и wyx.su/shards/).
  shards:
    build: ./bots/shards
    container_name: sux_chat_shards
    restart: unless-stopped
    environment:
      HYAX_API: http://api:8000/api
      HYAX_WS: ws://api:8000/ws
      HYAX_BOT_TOKEN: ${SHARDS_BOT_TOKEN:-}
      APP_URL: https://hyax.ru/shards/
      # @heroesIII открывает «Ретро-ПК»: на сообщения боту «Осколки» не отвечают
      BOT_REPLY: "0"
      # Список допуска Ретро-ПК правится командами боту (/allow, /deny, /list) — кем:
      RETRO_ALLOW_FILE: /retro-data/allow.txt
      RETRO_ADMINS: ${RETRO_ADMINS:-@EvilTree}
    volumes:
      # Партии и личные чаты с ботом (для уведомлений «ваш ход»).
      - ./bots/shards/data:/data
      - ./bots/retro/data:/retro-data
    depends_on:
      - api
    networks:
      - sux_chat_network

  # «Ретро-ПК» — эмулятор x86 (v86) как мини-приложение (bots/retro/README.md).
  # Только статика: образы дисков пользователь выбирает на своём устройстве.
  # Страница — https://hyax.ru/retro/.
  retro:
    build: ./bots/retro
    container_name: sux_chat_retro
    restart: unless-stopped
    environment:
      # Тот же бот @heroesIII: его токеном WYX подписывает данные запуска
      HYAX_BOT_TOKEN: ${SHARDS_BOT_TOKEN:-}
    volumes:
      # allow.txt — кому можно: @username или id пользователя, по строке
      - ./bots/retro/data:/data
    networks:
      - sux_chat_network

  # Отдельный VK music bot: слушает сообщения по WebSocket, показывает
  # результаты inline-кнопками и загружает выбранный MP3 через Hyax API.
  vk-music-bot:
    build: ./bots/vk-music-bot
    container_name: sux_chat_vk_music_bot
    restart: unless-stopped
    environment:
      HYAX_API: http://api:8000/api
      HYAX_WS: ws://api:8000/ws
      HYAX_BOT_TOKEN: ${VK_MUSIC_BOT_TOKEN:-}
      VK_AUDIO_TOKEN: ${VK_AUDIO_TOKEN:-}
      VK_AUDIO_API_VERSION: ${VK_AUDIO_API_VERSION:-5.131}
      VK_MUSIC_PARALLEL: ${VK_MUSIC_PARALLEL:-2}
    depends_on:
      - api
    networks:
      - sux_chat_network

  # TURN. В bridge-сети Docker coturn без --external-ip отдаёт relay-адресом
  # свой IP контейнера (172.x) — из интернета недостижимый, ретрансляция не
  # работала, звонки держались только на прямом пути через STUN и рвались на
  # мобильных сетях (2026-10-25). Публичный адрес сервера — TURN_EXTERNAL_IP.
  coturn:
    image: coturn/coturn:4.6.3
    container_name: sux_chat_coturn
    restart: unless-stopped
    command: >
      -n
      --fingerprint
      --realm=${TURN_REALM:-huyax.e-tree.su}
      --lt-cred-mech
      --user=${TURN_USERNAME:-turnuser}:${TURN_PASSWORD:-turnpassword}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --external-ip=${TURN_EXTERNAL_IP:-194.164.245.144}
      --no-cli
      --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - sux_chat_network

  # Общее состояние процессов api: слой каналов (события в сокеты), кэш
  # Django, присутствие (chat/presence.py). Всё с TTL — на диск не пишем,
  # после перезапуска состояние наберётся заново за минуту.
  redis:
    image: redis:7-alpine
    container_name: sux_chat_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru
    networks:
      - sux_chat_network

  db:
    image: postgres:15
    container_name: sux_chat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sux_chat_network

  # Распознаватель речи для api (см. WHISPER_URL там): наружу не торчит. Веса —
  # те же, что качал api (backend/whisper-models), только чтение, без сети к HF.
  whisper:
    build: ./bots/whisper-server
    image: hyax-whisper
    container_name: sux_chat_whisper
    restart: unless-stopped
    environment:
      WHISPER_TOKEN: ${WHISPER_TOKEN}
      WHISPER_MODEL: small
      WHISPER_THREADS: "3"
      HF_HUB_OFFLINE: "1"
      HOME: /tmp
      HF_HOME: /tmp/hf
      XDG_CACHE_HOME: /tmp/cache
    volumes:
      - ./backend/whisper-models:/models:ro
    expose:
      - "8745"
    mem_limit: 1200m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - sux_chat_network

  # Перевод сообщений (chat/translate.py): LibreTranslate с моделями ru/en/ko.
  # Наружу не торчит, только в сети compose. Первый старт качает модели.
  # С 09.11 выключен (профиль libre — без --profile libre не запускается).
  translate:
    image: libretranslate/libretranslate:latest
    container_name: sux_chat_translate
    profiles: ["libre"]
    restart: unless-stopped
    command: --load-only ru,en,ko --disable-web-ui --threads 2 --host 0.0.0.0 --port 5000
    volumes:
      - translate_models:/home/libretranslate/.local
    networks:
      - sux_chat_network

networks:
  sux_chat_network:
    external: true  # ← ДОБАВЬТЕ ЭТУ СТРОКУ
    name: sux_chat_network  # ← И ЭТУ (опционально, для ясности)

  # IPv6-only выход для api. С хоста Telegram Bot API отвечает только по IPv6
  # (IPv4-диапазоны 149.154.0.0/16 у провайдера не маршрутизируются), а
  # sux_chat_network создана без IPv6. Docker ≥27 сам делает NAT66 (ip6tables)
  # для ULA-подсети, поэтому контейнеру достаточно попасть в эту сеть.
  tg_v6:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd7a:1e9a:c0de::/64

volumes:
  translate_models:
  postgres_data:
