services:
  nginx:
    image: nginx:latest
    container_name: sux_chat_nginx
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/certs:/etc/letsencrypt:ro
      - ./backend/static:/app/static:ro
      - ./backend/media:/app/media:ro
      - ./web:/app/web:ro

    expose:
      - "80"
    networks:
      - sux_chat_network

  certbot:
    image: certbot/certbot:latest
    container_name: sux_chat_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/certs:/etc/letsencrypt
    entrypoint: ["certbot"]
    command:
      [
        "certonly",
        "--webroot",
        "--webroot-path=/var/www/certbot",
        "--email", "Ancher001@yandex.ru",
        "--agree-tos",
        "--no-eff-email",
        "-d", "huyax.e-tree.su"
      ]
    networks:
      - sux_chat_network

  api:
    build: ./backend
    container_name: sux_chat_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 sux_chat.asgi:application"
    volumes:
      - ./backend:/app
      - ./certbot/certs:/etc/letsencrypt:ro
    env_file:
      - .env
    environment:
      # Свой LibreTranslate (сервис translate ниже) — запасной бесплатный
      # переводчик; GEMINI_API_KEY или DEEPL_API_KEY в .env имеют приоритет.
      LIBRETRANSLATE_URL: http://translate:5000
    expose:
      - "8000"
    depends_on:
      - db
      - coturn
    networks:
      - sux_chat_network
      - tg_v6  # выход в IPv6: api.telegram.org по IPv4 у провайдера недоступен
    # Резолвер отдаёт IPv4-адреса Telegram первыми, а они у провайдера уходят в
    # чёрную дыру (не reject, а silent drop) — urllib3 доходит до IPv6 только
    # после полного таймаута на каждом v4-адресе. /etc/hosts приоритетнее DNS,
    # поэтому прибиваем имя к AAAA; TLS цел, имя хоста то же. Если Telegram
    # сменит адрес — сверить `dig AAAA api.telegram.org` и поправить здесь.
    extra_hosts:
      - "api.telegram.org:2001:67c:4e8:f004::9"

  # Зеркала Telegram-каналов: реальный аккаунт через Telethon (MTProto) вступает
  # в каналы, которые люди подключили ссылкой, и пересылает посты в WYX в
  # реальном времени. Тот же образ, что у api, и та же база через Django ORM.
  # Перед первым запуском — вход: docker compose run --rm -it tg python manage.py tg_login
  # (TG_API_ID/TG_API_HASH в .env, сессия ляжет в backend/private/tg.session).
  tg:
    build: ./backend
    container_name: sux_chat_tg
    restart: unless-stopped
    command: python manage.py tg_mirror
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - api
    networks:
      - sux_chat_network
      - tg_v6  # MTProto по IPv6 — IPv4 Telegram у провайдера глушится (см. api)

  # Бот: ссылка в чат — файл в ответ. Ходит во внутренний api по токену бота,
  # поэтому трафик не выходит наружу и шлюз не режет большие файлы.
  media-bot:
    build: ./bots/media-bot
    container_name: sux_chat_media_bot
    restart: unless-stopped
    environment:
      HYAX_API: http://api:8000/api
      HYAX_WS: ws://api:8000/ws
      HYAX_BOT_TOKEN: ${MEDIA_BOT_TOKEN:-}
      HYAX_QUALITY: ${MEDIA_BOT_QUALITY:-720}
      HYAX_PARALLEL: ${MEDIA_BOT_PARALLEL:-2}
      COOKIES_DIR: /cookies
      # Из Москвы YouTube закрыт — yt-dlp ходит через прокси в Нидерландах
      # (сервис ytproxy ниже). Внутренний api — напрямую.
      HTTPS_PROXY: http://ytproxy:8888
      HTTP_PROXY: http://ytproxy:8888
      NO_PROXY: api,localhost,127.0.0.1
    volumes:
      # Не только на чтение: yt-dlp продлевает сессию и переписывает файл —
      # иначе куки протухают за считаные дни.
      - ./bots/media-bot/cookies:/cookies
    depends_on:
      - api
      - ytproxy
    networks:
      - sux_chat_network

  # TLS-обёртка до прокси на нидерландском сервере (bots/ytproxy/nginx.conf).
  ytproxy:
    image: nginx:stable-alpine
    container_name: sux_chat_ytproxy
    restart: unless-stopped
    volumes:
      - ./bots/ytproxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./bots/ytproxy/certs:/certs:ro
    networks:
      - sux_chat_network

  # Отдельный VK music bot: слушает сообщения по WebSocket, показывает
  # результаты inline-кнопками и загружает выбранный MP3 через Hyax API.
  vk-music-bot:
    build: ./bots/vk-music-bot
    container_name: sux_chat_vk_music_bot
    restart: unless-stopped
    environment:
      HYAX_API: http://api:8000/api
      HYAX_WS: ws://api:8000/ws
      HYAX_BOT_TOKEN: ${VK_MUSIC_BOT_TOKEN:-}
      VK_AUDIO_TOKEN: ${VK_AUDIO_TOKEN:-}
      VK_AUDIO_API_VERSION: ${VK_AUDIO_API_VERSION:-5.131}
      VK_MUSIC_PARALLEL: ${VK_MUSIC_PARALLEL:-2}
    depends_on:
      - api
    networks:
      - sux_chat_network

  coturn:
    image: coturn/coturn:4.6.3
    container_name: sux_chat_coturn
    restart: unless-stopped
    command: >
      -n
      --fingerprint
      --realm=${TURN_REALM:-huyax.e-tree.su}
      --lt-cred-mech
      --user=${TURN_USERNAME:-turnuser}:${TURN_PASSWORD:-turnpassword}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --no-cli
      --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - sux_chat_network

  db:
    image: postgres:15
    container_name: sux_chat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sux_chat_network

  # Перевод сообщений (chat/translate.py): LibreTranslate с моделями ru/en/ko.
  # Наружу не торчит, только в сети compose. Первый старт качает модели.
  translate:
    image: libretranslate/libretranslate:latest
    container_name: sux_chat_translate
    restart: unless-stopped
    command: --load-only ru,en,ko --disable-web-ui --threads 2 --host 0.0.0.0 --port 5000
    volumes:
      - translate_models:/home/libretranslate/.local
    networks:
      - sux_chat_network

networks:
  sux_chat_network:
    external: true  # ← ДОБАВЬТЕ ЭТУ СТРОКУ
    name: sux_chat_network  # ← И ЭТУ (опционально, для ясности)

  # IPv6-only выход для api. С хоста Telegram Bot API отвечает только по IPv6
  # (IPv4-диапазоны 149.154.0.0/16 у провайдера не маршрутизируются), а
  # sux_chat_network создана без IPv6. Docker ≥27 сам делает NAT66 (ip6tables)
  # для ULA-подсети, поэтому контейнеру достаточно попасть в эту сеть.
  tg_v6:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd7a:1e9a:c0de::/64

volumes:
  translate_models:
  postgres_data:
