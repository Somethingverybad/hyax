# Обёртка прокси для media-bot (ytbot): из Москвы YouTube закрыт, поэтому бот
# ходит через HTTP-прокси на нидерландском сервере (контейнер wyx-ytproxy,
# gost, 148.253.213.224:8444). Бот говорит обычный HTTP CONNECT на ytproxy:8888,
# nginx заворачивает поток в TLS: сертификат сервера сверяем с certs/server.pem,
# себя предъявляем клиентским сертификатом бота (certs/client.pem + client.key —
# ключ живёт только здесь, в git не попадает). Снаружи виден только TLS до
# нидерландского адреса — что внутри YouTube, фильтру не видно.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }

stream {
    server {
        listen 8888;
        proxy_pass 148.253.213.224:8444;
        proxy_connect_timeout 10s;
        proxy_timeout 15m;

        proxy_ssl on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/server.pem;
        # nginx сверяет имя только с доменами, IP из сертификата не подходит —
        # сверяем с его CN. Доверяем всё равно только одному server.pem.
        proxy_ssl_name wyx-relay;
        proxy_ssl_certificate /certs/client.pem;
        proxy_ssl_certificate_key /certs/client.key;
    }
}
