# Статика «Ретро-ПК»: страница, v86 и BIOS. Образы дисков сюда не попадают —
# их читает браузер с устройства пользователя.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Файлов немного; проверка по ETag дешевле, чем ловить устаревший app.js.
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
    # Модуль v86 — .mjs: без верного типа браузер не запустит его как скрипт.
    location ~ \.mjs$ { types { } default_type text/javascript; add_header Cache-Control "no-cache" always; }
}
