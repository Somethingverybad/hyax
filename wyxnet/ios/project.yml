# Проект генерируется: xcodegen generate (brew install xcodegen). Сам .xcodeproj в git не кладём.
name: WYXNet
options:
  bundleIdPrefix: com.hyax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: BTQ69VVHX6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  WYXNet:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: WYXNetTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyax.wyxnet
        PRODUCT_NAME: WYXNet
        CODE_SIGN_ENTITLEMENTS: App/WYXNet.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: WYX Net
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WYX Net
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  WYXNetTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared
    # Ядро и tun2socks — статические библиотеки из Vendor/*.xcframework (Vendor/fetch.sh);
    # линкуем напрямую, а не как xcframework: оба несут module.modulemap, Xcode их сталкивает.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyax.wyxnet.tunnel
        CODE_SIGN_ENTITLEMENTS: Tunnel/WYXNetTunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Tunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/LibXray.xcframework/ios-arm64/Headers
          - $(SRCROOT)/Vendor/HevSocks5Tunnel.xcframework/ios-arm64/Headers
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/LibXray.xcframework/ios-arm64
          - $(SRCROOT)/Vendor/HevSocks5Tunnel.xcframework/ios-arm64
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - $(inherited)
          - $(SRCROOT)/Vendor/LibXray.xcframework/ios-arm64_x86_64-simulator
          - $(SRCROOT)/Vendor/HevSocks5Tunnel.xcframework/ios-arm64_x86_64-simulator
        OTHER_LDFLAGS:
          - $(inherited)
          - -lresolv
          - -lXray
          - -lhev-socks5-tunnel
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: WYX Net Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
